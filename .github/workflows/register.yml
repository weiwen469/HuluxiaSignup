name: 自动注册葫芦侠账号

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  register:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 缓存 Playwright 浏览器
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: 安装 Playwright 浏览器（仅缓存未命中时）
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: 运行注册脚本
        env:
          HAOZHU_TOKEN: ${{ secrets.HAOZHU_TOKEN }}
          HAOZHU_SID: ${{ secrets.HAOZHU_SID }}
          ACCOUNT_PASSWORD: ${{ secrets.ACCOUNT_PASSWORD }}
          SMS_TIMEOUT: ${{ secrets.SMS_TIMEOUT }}
          POLL_INTERVAL: ${{ secrets.POLL_INTERVAL }}
          MIN_BALANCE: ${{ secrets.MIN_BALANCE }}
        run: python main.py
